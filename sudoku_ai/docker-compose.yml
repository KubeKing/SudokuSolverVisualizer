version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: sudoku-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - sudoku-network

  frontend:
    build:
      context: ./frontend
    container_name: sudoku-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - sudoku-network

networks:
  sudoku-network:
    driver: bridge